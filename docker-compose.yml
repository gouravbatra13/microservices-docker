##for development

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-service:
    build: ./user-service
    ports:
      - "3001:3001"
    depends_on:
      - mongo
    volumes:
      - ./user-service:/app
      - /app/node_modules
    command: npm run dev    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    

  order-service:
    build: ./order-service
    ports:
      - "3002:3002"
    depends_on:
      - mongo
    volumes:
      - ./order-service:/app
      - /app/node_modules
    command: npm run dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - order-service
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
    command: npm run dev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        
    ## message broker rabbitmq
    rabbitmq:
      image: rabbitmq:4-management
      container_name: rabbitmq
      ports:
        - "5672:5672"
        - "15672:15672"
      environment:
        RABBITMQ_DEFAULT_USER: admin
        RABBITMQ_DEFAULT_PASS: admin123
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      restart: unless-stopped

  ## centralized logging

  loki:
    image: grafana/loki:3.4.2
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.4.2
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3005:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  mongo_data:
  loki_data:
  grafana_data:
  rabbitmq_data: